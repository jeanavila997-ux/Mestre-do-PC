name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp-server/package-lock.json
      - name: Install root dependencies
        run: npm ci --ignore-scripts
      - name: Install MCP dependencies
        working-directory: mcp-server
        # @qwen-code/cua-sdk não é dependência deste pacote: o import fica em
        # v10/computer-use-client.js e resolve v10/node_modules ou a raiz.
        # --ignore-scripts evita postinstall nativo (Authenticode do cua-sdk na
        # raiz; puppeteer se voltar ao lock) no runner do Actions.
        run: npm ci --ignore-scripts
      - name: Run MCP tests
        working-directory: mcp-server
        run: npm test
      - name: Check JavaScript syntax
        shell: pwsh
        run: |
          node --check v10/launcher.js
          node --check v10/terminal-launch.js
          node --check v10/security/origin-policy.js
          node --check v10/security/session-gate.js
          node --check v10/security/approvals.js
          node --check v10/model-profile-overrides.js
          node --check deploy/vps/server.mjs
          node --check mobile/gateway/server.mjs
          node --check v10/chat-integrado/chat-integrado.js
          node --check v10/chat-integrado/user-library.js
          node --check v10/chat-integrado/user-library-pure.js
          node --check v10/chat-integrado/user-library-routes.js
          node --check v10/chat-integrado/user-library-ui.js
          node --check v10/chat-integrado/obsidian-chat.js
          node --check v10/chat-integrado/kokoro-voice.js
          node --check v10/chat-integrado/voice-output.js
          node --check mcp-server/model-catalog.js
          node --test v10/security/origin-policy.test.mjs v10/security/session-gate.test.mjs v10/security/approvals.test.mjs deploy/vps/server.test.mjs mobile/gateway/test/gateway.test.mjs
          node --check mcp-server/index.js
          node --check mcp-server/security/webhook-url.js
          node --check mcp-server/security/table-path.js
          node --check mcp-server/security/visual-script.js
          node --check mcp-server/security.js
